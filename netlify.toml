# Deploy the redesigned site, not the legacy Create React App at the repo root.
[build]
  base = "reimagined"
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"

# SPA routing and the existing /mcp proxy are in reimagined/public/_redirects.
[[headers]]
  for = "/assets/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
