# Deploy the redesigned site, not the legacy Create React App at the repo root.
[build]
  base = "reimagined"
  command = "npm run build"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "22"

# The build emits pre-rendered pages and routing rules, retaining the /mcp proxy.
[[headers]]
  for = "/assets/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=utf-8"
